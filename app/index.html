<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落笔生花 Luobishenghua</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 菜单栏（PS 风格） -->
  <nav id="menubar"></nav>

  <!-- 属性栏（PS 的「工具选项栏」）：随当前工具显示参数 -->
  <header id="optionsbar">
    <div class="opt-tool">
      <i id="opt-tool-icon">✏</i>
      <span id="opt-tool-name">画笔</span>
    </div>
    <span class="opt-sep"></span>

    <label class="opt">粗细
      <input type="range" id="brush-size" min="1" max="200" value="24">
      <span class="val" id="brush-size-val">24</span>
    </label>
    <label class="opt">不透明度
      <input type="range" id="brush-opacity" min="5" max="100" value="100">
      <span class="val" id="brush-opacity-val">100%</span>
    </label>
    <label class="opt" title="防抖：数值越大线条越平滑，但会略微滞后">防抖
      <input type="range" id="brush-smoothing" min="0" max="100" value="0">
      <span class="val" id="brush-smoothing-val">0%</span>
    </label>
    <span class="opt-sep"></span>
    <label class="opt" title="当前前景色">颜色
      <span id="color-chip"></span>
    </label>

    <div class="opt-right">
      <button id="btn-home" title="返回首页">首页</button>
      <span class="sep"></span>
      <button id="btn-undo" title="撤销 (Cmd+Z)">↩</button>
      <button id="btn-redo" title="重做 (Cmd+Shift+Z)">↪</button>
      <span class="sep"></span>
      <button id="btn-rotate-left" title="逆时针旋转 15°">⟲</button>
      <button id="btn-rotate-right" title="顺时针旋转 15°">⟳</button>
      <button id="btn-reset-view" title="复位视图 (0)">复位</button>
      <span id="zoom-label">100%</span>
      <span class="sep"></span>
      <button id="btn-open" title="打开 PSD 文件（也可直接拖入窗口）">打开 PSD</button>
      <button id="btn-save-psd" title="导出为 PSD（分层）">导出 PSD</button>
      <button id="btn-save" class="primary" title="导出 PNG">导出 PNG</button>
    </div>
    <input type="file" id="file-open" accept=".psd" style="display:none">
    <input type="file" id="file-open-project" accept=".lbsh" style="display:none">
  </header>

  <!-- 工作区：画布 + 可停靠面板 -->
  <main id="stage">
    <canvas id="canvas"></canvas>

    <div id="dock-root">

      <section class="panel" data-panel="tools" data-dock="left">
        <div class="panel-title"><span class="grip"></span><span class="name">工具</span><button class="panel-collapse" title="折叠">–</button></div>
        <div class="panel-body">
          <div class="tool-list" id="tool-list">
            <button data-tool="brush" class="active"><i>✏</i> 画笔 <kbd>B</kbd></button>
            <button data-tool="eraser"><i>◻</i> 橡皮 <kbd>E</kbd></button>
            <button data-tool="hand"><i>✋</i> 抓手 <kbd>H</kbd></button>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="brushes" data-dock="left">
        <div class="panel-title"><span class="grip"></span><span class="name">笔刷仓库</span><button class="panel-collapse" title="折叠">–</button></div>
        <div class="panel-body">
          <div class="brush-actions">
            <button id="btn-import-abr" title="导入 Photoshop 笔刷（.abr，也可拖入窗口）">导入 .abr 笔刷</button>
            <input type="file" id="file-abr" accept=".abr" style="display:none">
          </div>
          <div class="brush-grid" id="brush-presets"></div>
        </div>
      </section>

      <section class="panel" data-panel="color" data-dock="left">
        <div class="panel-title"><span class="grip"></span><span class="name">颜色</span><button class="panel-collapse" title="折叠">–</button></div>
        <div class="panel-body">
          <canvas id="color-wheel" width="160" height="160"></canvas>
          <div id="swatches"></div>
        </div>
      </section>

      <section class="panel" data-panel="navigator" data-dock="right">
        <div class="panel-title"><span class="grip"></span><span class="name">导航器</span><button class="panel-collapse" title="折叠">–</button></div>
        <div class="panel-body">
          <canvas id="navigator" width="216" height="160"></canvas>
          <div class="panel-hint">拖动红框移动视野</div>
        </div>
      </section>

      <section class="panel" data-panel="layers" data-dock="right">
        <div class="panel-title"><span class="grip"></span><span class="name">图层</span><button class="panel-collapse" title="折叠">–</button></div>
        <div class="panel-body">
          <div class="layer-controls">
            <select id="layer-blend" title="混合模式">
              <option value="source-over">正常</option>
              <option value="multiply">正片叠底</option>
              <option value="screen">滤色</option>
              <option value="overlay">叠加</option>
              <option value="soft-light">柔光</option>
              <option value="darken">变暗</option>
              <option value="lighten">变亮</option>
              <option value="color-dodge">颜色加深</option>
              <option value="lighter">线性减淡</option>
            </select>
            <input type="range" id="layer-opacity" min="0" max="100" value="100" title="图层不透明度">
            <span id="layer-opacity-val">100</span>
          </div>
          <div class="layer-controls btns">
            <button id="btn-layer-add" title="新建图层">＋图层</button>
            <button id="btn-layer-group" title="新建组">＋组</button>
            <button id="btn-layer-del" title="删除">删除</button>
            <button id="btn-layer-up" title="上移一层">↑</button>
            <button id="btn-layer-down" title="下移一层">↓</button>
          </div>
          <div class="layer-controls btns">
            <button id="btn-layer-mask" title="添加 / 启用蒙版">蒙版</button>
            <button id="btn-layer-clip" title="剪贴蒙版（以下一层为基底）">剪贴</button>
            <button id="btn-layer-merge" title="向下合并">合并</button>
            <button id="btn-layer-lockalpha" title="锁定透明像素">锁α</button>
          </div>
          <div id="layer-list"></div>
          <div class="panel-hint">点蒙版缩略图可编辑蒙版 · 双击名称重命名</div>
        </div>
      </section>

      <section class="panel" data-panel="history" data-dock="right">
        <div class="panel-title"><span class="grip"></span><span class="name">历史</span><button class="panel-collapse" title="折叠">–</button></div>
        <div class="panel-body">
          <div class="hist-head">
            <button id="btn-hist-undo" title="撤销 (Cmd+Z)">↩</button>
            <button id="btn-hist-redo" title="重做 (Shift+Cmd+Z)">↪</button>
            <span id="hist-memory" class="hist-mem"></span>
          </div>
          <div id="history-list"></div>
          <div class="panel-hint">点击任意步骤可直接跳转</div>
        </div>
      </section>

    </div>
  </main>

  <footer id="statusbar">
    <span id="status-doc">画布 1600 × 1600</span>
    <span id="status-brush"></span>
    <span id="status-pressure">压感: —</span>
    <span id="status-autosave"></span>
    <span class="hint">拖动标题栏可移动面板 · 拖到左右边缘贴合停靠 · 空格/H 抓手 · [ ] 调粗细</span>
  </footer>

  <!-- 首页 / 欢迎页 -->
  <div id="home" class="hidden">
    <div class="home-top">
      <div class="home-logo">墨</div>
      <div class="home-brand">
        <h1>落笔生花</h1>
        <p>LUOBISHENGHUA · 专为绘画打造</p>
      </div>
      <div class="home-spacer"></div>
      <button class="home-close" id="home-close">返回画布</button>
    </div>

    <div id="recovery-banner" class="recovery hidden">
      <span class="rec-ic">⟳</span>
      <span class="rec-text">发现上次未保存的工作：<b id="recovery-name">未命名.lbsh</b><span id="recovery-time" class="rec-time"></span></span>
      <button id="recovery-restore" class="primary">恢复</button>
      <button id="recovery-discard">丢弃</button>
    </div>

    <div class="home-grid">
      <div>
        <div class="home-section">
          <h2>开始</h2>
          <div class="home-actions">
            <button class="home-action primary" id="home-new">
              <span class="ic">＋</span>
              <span class="t">新建画布</span>
              <span class="d">自定义尺寸与预设</span>
            </button>
            <button class="home-action" id="home-open">
              <span class="ic">📂</span>
              <span class="t">打开 PSD</span>
              <span class="d">继续编辑已有文档</span>
            </button>
            <button class="home-action" id="home-abr">
              <span class="ic">🖌</span>
              <span class="t">导入 .abr 笔刷</span>
              <span class="d">接入 Photoshop 笔刷</span>
            </button>
          </div>
        </div>

        <div class="home-section">
          <h2>画布预设</h2>
          <div class="preset-grid" id="preset-grid"></div>
        </div>
      </div>

      <div class="home-section">
        <h2>最近文件</h2>
        <div class="recent-list" id="recent-list"></div>
      </div>
    </div>

    <div class="home-foot">
      <span>落笔生花 Luobishenghua · beta6</span>
      <span>WorkBuddy × likeweixue</span>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>

  <!-- 模态对话框 -->
  <div id="modal-overlay" class="hidden"><div id="modal"></div></div>
</body>
</html>
