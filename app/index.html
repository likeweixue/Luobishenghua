<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
  落笔生花 Luobishenghua · Photoshop 风格绘画工作台
  DeepSeek 自 beta12 起参与界面、面板交互、WebGL2 合成与测试；beta14 加入单列工具栏与标签拖拽，beta15 把 GPU 合成扩展到组 / 蒙版 / 混合模式，beta16 用纹理数组 + instanced draw 批量化瓦片，beta17 接入无头 Chrome 自动化回归测试，beta18 加入 GPU 笔刷预览与抬笔批量提交，beta19 加入真实应用端到端回归，beta20 用 OffscreenCanvas + Worker 把抬笔提交移出主线程，beta21 把核心 GPU / 瓦片 / Worker 模块迁移到 TypeScript，beta22 继续迁移 engine / layers，beta23 迁移 history / transform / brushes，beta24 迁移 main / dock / menu，beta25 把剩余 paint / psd / abr 等模块全部迁移到 TypeScript。
-->

<div id="app">
  <!-- ===== 菜单栏 / 标题栏 ===== -->
  <header id="menubar" data-tauri-drag-region>
    <div class="app-badge" data-tauri-drag-region>笔</div>
    <nav class="menus" id="menu-items"></nav>
    <div class="menubar-fill" data-tauri-drag-region></div>
    <div class="menubar-right">
      <span class="beta-tag">beta25</span>
      <button class="mb-icon" id="btn-home" title="首页 / 最近文件" data-tip="首页">
        <svg class="ic"><use href="#i-home"/></svg>
      </button>
      <button class="mb-icon" id="btn-settings" title="偏好设置" data-tip="偏好设置">
        <svg class="ic"><use href="#i-gear"/></svg>
      </button>
      <button class="mb-icon" id="btn-shortcuts" title="快捷键一览" data-tip="快捷键">
        <svg class="ic"><use href="#i-help"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== 工具选项栏 ===== -->
  <header id="optionsbar">
    <div class="opt-tool">
      <svg class="ic" id="opt-tool-icon"><use id="opt-tool-use" href="#i-brush"/></svg>
      <span id="opt-tool-name">画笔</span>
    </div>
    <span class="opt-sep"></span>

    <div class="opt-group" id="opt-brush-group">
      <button id="btn-brush-preset" class="brush-pop" title="画笔预设">
        <canvas id="brush-preview" width="30" height="30"></canvas>
        <span class="caret"></span>
      </button>
      <button id="btn-brush-settings" class="opt-icon" title="画笔设置" data-tip="画笔设置">
        <svg class="ic"><use href="#i-sliders"/></svg>
      </button>
      <label class="opt">大小
        <input type="range" id="brush-size" min="1" max="200" value="24">
        <span class="val" id="brush-size-val">24</span>
      </label>
      <label class="opt">不透明度
        <input type="range" id="brush-opacity" min="5" max="100" value="100">
        <span class="val" id="brush-opacity-val">100%</span>
      </label>
      <label class="opt" title="防抖：数值越大线条越平滑，但会略微滞后">防抖
        <input type="range" id="brush-smoothing" min="0" max="100" value="0">
        <span class="val" id="brush-smoothing-val">0%</span>
      </label>
    </div>

    <div class="opt-group hidden" id="opt-smudge-group">
      <label class="opt" title="涂抹强度：每次移动携带多少像素">强度
        <input type="range" id="smudge-strength" min="5" max="100" value="55">
        <span class="val" id="smudge-strength-val">55%</span>
      </label>
    </div>

    <div class="opt-group hidden" id="opt-bucket-group">
      <label class="opt" title="颜色差异在容差内视为同一区域">容差
        <input type="range" id="fill-tolerance" min="0" max="255" value="32">
        <span class="val" id="fill-tolerance-val">32</span>
      </label>
      <label class="opt opt-check"><input type="checkbox" id="fill-contiguous" checked> 连续</label>
    </div>

    <div class="opt-group hidden" id="opt-gradient-group">
      <label class="opt">类型
        <select id="grad-type">
          <option value="linear">线性</option>
          <option value="radial">径向</option>
        </select>
      </label>
      <label class="opt opt-check"><input type="checkbox" id="grad-reverse"> 反向</label>
      <span class="opt-hint">前景色 → 透明</span>
    </div>

    <div class="opt-group hidden" id="opt-pick-group">
      <label class="opt">取样
        <select id="pick-mode">
          <option value="all">所有图层</option>
          <option value="layer">当前图层</option>
        </select>
      </label>
    </div>

    <div class="opt-group hidden" id="opt-select-group">
      <button id="btn-sel-all" class="opt-btn" title="全选 (⌘A)">全选</button>
      <button id="btn-sel-invert" class="opt-btn" title="反选 (⇧⌘I)">反选</button>
      <button id="btn-sel-feather" class="opt-btn" title="羽化选区">羽化…</button>
      <button id="btn-sel-none" class="opt-btn" title="取消选择 (⌘D)">取消选择</button>
    </div>

    <div class="opt-group hidden" id="opt-transform-group">
      <button id="btn-tr-flip-h" class="opt-btn" title="水平翻转">水平翻转</button>
      <button id="btn-tr-flip-v" class="opt-btn" title="垂直翻转">垂直翻转</button>
      <button id="btn-tr-apply" class="opt-btn primary" title="应用 (Enter)">应用</button>
      <button id="btn-tr-cancel" class="opt-btn" title="取消 (Esc)">取消</button>
    </div>

    <div class="opt-group hidden" id="opt-zoom-group">
      <button id="btn-zoom-fit" class="opt-btn" title="适合屏幕 (⌘0)">适合屏幕</button>
      <button id="btn-zoom-100" class="opt-btn" title="实际像素 (⌘1)">100%</button>
    </div>

    <div class="opt-right">
      <button class="opt-icon" id="btn-undo" title="撤销 (⌘Z)" data-tip="撤销">
        <svg class="ic"><use href="#i-undo"/></svg>
      </button>
      <button class="opt-icon" id="btn-redo" title="重做 (⇧⌘Z)" data-tip="重做">
        <svg class="ic"><use href="#i-redo"/></svg>
      </button>
      <span class="opt-sep"></span>
      <button class="opt-icon" id="btn-rotate-left" title="逆时针旋转 15°" data-tip="逆时针旋转">
        <svg class="ic"><use href="#i-rotate-ccw"/></svg>
      </button>
      <button class="opt-icon" id="btn-rotate-right" title="顺时针旋转 15°" data-tip="顺时针旋转">
        <svg class="ic"><use href="#i-rotate-cw"/></svg>
      </button>
      <button class="opt-icon" id="btn-reset-view" title="适合屏幕 (⌘0)" data-tip="适合屏幕">
        <svg class="ic"><use href="#i-fit"/></svg>
      </button>
      <span class="opt-sep"></span>
      <button class="opt-icon" id="btn-open" title="打开 PSD（也可直接拖入窗口）" data-tip="打开 PSD">
        <svg class="ic"><use href="#i-open"/></svg>
      </button>
      <button class="opt-icon" id="btn-save-psd" title="导出为 PSD（分层）" data-tip="导出 PSD">
        <svg class="ic"><use href="#i-image"/></svg>
      </button>
      <button class="opt-icon export" id="btn-save" title="导出 PNG" data-tip="导出 PNG">
        <svg class="ic"><use href="#i-export"/></svg>
      </button>
    </div>
    <input type="file" id="file-open" accept=".psd" style="display:none">
    <input type="file" id="file-open-project" accept=".lbsh" style="display:none">
  </header>

  <!-- ===== 主工作区 ===== -->
  <main id="main">
    <!-- 左侧工具栏 -->
    <aside id="toolbar">
      <div class="tool-list" id="tool-list">
        <button data-tool="move" title="移动工具 (V)" data-tip="移动工具 · V"><svg class="ic"><use href="#i-move"/></svg></button>
        <button data-tool="zoom" title="缩放工具 (Z)" data-tip="缩放工具 · Z"><svg class="ic"><use href="#i-zoom"/></svg></button>
        <button data-tool="rect" title="矩形选框 (M)" data-tip="矩形选框 · M"><svg class="ic"><use href="#i-marquee"/></svg></button>
        <button data-tool="ellipse" class="flyout" title="椭圆选框 (⇧M)" data-tip="椭圆选框 · ⇧M" data-group="marquee"><svg class="ic"><use href="#i-ellipse"/></svg></button>
        <button data-tool="lasso" title="套索 (L)" data-tip="套索 · L"><svg class="ic"><use href="#i-lasso"/></svg></button>
        <button data-tool="poly" class="flyout" title="多边形套索 (⇧L)" data-tip="多边形套索 · ⇧L" data-group="lasso"><svg class="ic"><use href="#i-poly"/></svg></button>
        <button data-tool="brush" class="active" title="画笔 (B)" data-tip="画笔 · B"><svg class="ic"><use href="#i-brush"/></svg></button>
        <button data-tool="eraser" class="flyout" title="橡皮擦 (E)" data-tip="橡皮擦 · E" data-group="brush"><svg class="ic"><use href="#i-eraser"/></svg></button>
        <button data-tool="smudge" class="flyout" title="涂抹 (S)" data-tip="涂抹 · S" data-group="brush"><svg class="ic"><use href="#i-smudge"/></svg></button>
        <button data-tool="bucket" title="油漆桶 (G)" data-tip="油漆桶 · G"><svg class="ic"><use href="#i-bucket"/></svg></button>
        <button data-tool="gradient" class="flyout" title="渐变 (⇧G)" data-tip="渐变 · ⇧G" data-group="fill"><svg class="ic"><use href="#i-gradient"/></svg></button>
        <button data-tool="eyedropper" class="flyout" title="吸管 (I)" data-tip="吸管 · I" data-group="fill"><svg class="ic"><use href="#i-eyedropper"/></svg></button>
        <button data-tool="hand" title="抓手 (H)" data-tip="抓手 · H"><svg class="ic"><use href="#i-hand"/></svg></button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="color-wells">
        <button class="well well-bg" id="btn-color-bg" title="背景色">
          <span id="color-bg-chip"></span>
        </button>
        <button class="well well-fg" id="btn-color-fg" title="前景色">
          <span id="color-chip"></span>
        </button>
        <button class="well-ic well-swap" id="btn-swap-colors" title="交换前景/背景色 (X)">
          <svg class="ic"><use href="#i-swap"/></svg>
        </button>
        <button class="well-ic well-default" id="btn-default-colors" title="默认黑白 (D)">
          <svg class="ic"><use href="#i-default-colors"/></svg>
        </button>
      </div>
    </aside>

    <!-- 画布列：文档标签 + 标尺 + 画布 -->
    <div id="canvas-col">
      <div id="doctabs">
        <div class="doc-tab active" id="doc-tab">
          <svg class="ic doc-ic"><use href="#i-doc"/></svg>
          <span class="doc-name" id="doc-tab-name">未命名.lbsh</span>
          <span class="doc-dirty" id="doc-dirty" title="有未保存的修改"></span>
          <button class="doc-close" id="doc-tab-close" title="关闭文档">×</button>
        </div>
        <button class="doc-new" id="doc-new" title="新建文档 (⌘N)">＋</button>
        <div class="doc-fill"></div>
        <div class="doc-meta">sRGB · 8 位/通道</div>
      </div>

      <div id="canvas-area" class="rulers-on">
        <div id="ruler-corner" title="单位：px">px</div>
        <canvas id="ruler-h"></canvas>
        <canvas id="ruler-v"></canvas>
        <div id="stage">
          <canvas id="glcanvas"></canvas>
          <canvas id="canvas"></canvas>
        </div>
      </div>
    </div>

    <!-- 右侧面板坞 -->
    <aside id="dock-root" class="dock">
      <div class="dock-resizer" title="拖动调整面板宽度"></div>

      <div class="dock-group" data-group="color">
        <div class="dock-head">
          <div class="dock-tabs">
            <button class="dock-tab active" data-tab="color">颜色</button>
            <button class="dock-tab" data-tab="swatches">色板</button>
          </div>
          <button class="dock-btn dock-menu" data-menu="color" title="面板菜单">
            <svg class="ic"><use href="#i-hamburger"/></svg>
          </button>
          <button class="dock-btn dock-toggle" title="折叠面板">
            <svg class="ic"><use href="#i-chevron-down"/></svg>
          </button>
        </div>
        <div class="dock-body">
          <section class="panel" data-panel="color" data-name="颜色">
            <div class="panel-body color-body">
              <canvas id="color-wheel" width="160" height="160"></canvas>
              <div class="color-readout">
                <span class="mini-chip" id="panel-fg-chip"></span>
                <input class="hex-input" id="color-hex" value="#222222" maxlength="7" spellcheck="false" title="十六进制颜色">
                <span class="color-rgb" id="color-rgb">34, 34, 34</span>
              </div>
            </div>
          </section>
          <section class="panel" data-panel="swatches" data-name="色板">
            <div class="panel-body swatches-body">
              <div id="swatches"></div>
              <button class="wide-btn" id="swatch-add">＋ 添加当前颜色</button>
              <div class="panel-hint">左键应用 · 右键删除</div>
            </div>
          </section>
        </div>
      </div>

      <div class="dock-splitter" data-resize="color"></div>

      <div class="dock-group dock-grow" data-group="layers">
        <div class="dock-head">
          <div class="dock-tabs">
            <button class="dock-tab active" data-tab="layers">图层</button>
          </div>
          <button class="dock-btn dock-menu" data-menu="layers" title="面板菜单">
            <svg class="ic"><use href="#i-hamburger"/></svg>
          </button>
          <button class="dock-btn dock-toggle" title="折叠面板">
            <svg class="ic"><use href="#i-chevron-down"/></svg>
          </button>
        </div>
        <div class="dock-body">
          <section class="panel" data-panel="layers" data-name="图层">
            <div class="layers-top">
              <select id="layer-blend" class="blend-select" title="混合模式">
                <option value="source-over">正常</option>
                <option value="multiply">正片叠底</option>
                <option value="screen">滤色</option>
                <option value="overlay">叠加</option>
                <option value="soft-light">柔光</option>
                <option value="darken">变暗</option>
                <option value="lighten">变亮</option>
                <option value="color-dodge">颜色加深</option>
                <option value="lighter">线性减淡</option>
              </select>
              <div class="opacity-line">
                <span>不透明度</span>
                <input type="range" id="layer-opacity" min="0" max="100" value="100" title="图层不透明度">
                <span id="layer-opacity-val" class="opacity-val">100%</span>
              </div>
            </div>
            <div id="layer-list"></div>
            <div class="layer-actions">
              <button class="lb" id="btn-layer-mask" title="添加 / 启用蒙版">
                <svg class="ic"><use href="#i-mask"/></svg>
              </button>
              <button class="lb" id="btn-layer-clip" title="剪贴蒙版（以下一层为基底）">
                <svg class="ic"><use href="#i-clip"/></svg>
              </button>
              <button class="lb" id="btn-layer-lockalpha" title="锁定透明像素">
                <svg class="ic"><use href="#i-alpha"/></svg>
              </button>
              <button class="lb" id="btn-layer-merge" title="向下合并">
                <svg class="ic"><use href="#i-merge"/></svg>
              </button>
              <span class="vsep"></span>
              <button class="lb" id="btn-layer-up" title="上移一层">
                <svg class="ic"><use href="#i-arrow-up"/></svg>
              </button>
              <button class="lb" id="btn-layer-down" title="下移一层">
                <svg class="ic"><use href="#i-arrow-down"/></svg>
              </button>
              <span class="flex-spacer"></span>
              <button class="lb" id="btn-layer-group" title="新建组">
                <svg class="ic"><use href="#i-folder-plus"/></svg>
              </button>
              <button class="lb" id="btn-layer-add" title="新建图层">
                <svg class="ic"><use href="#i-plus"/></svg>
              </button>
              <button class="lb" id="btn-layer-del" title="删除图层">
                <svg class="ic"><use href="#i-trash"/></svg>
              </button>
            </div>
          </section>
        </div>
      </div>

      <div class="dock-splitter" data-resize="history"></div>

      <div class="dock-group" data-group="history">
        <div class="dock-head">
          <div class="dock-tabs">
            <button class="dock-tab active" data-tab="history">历史</button>
            <button class="dock-tab" data-tab="navigator">导航器</button>
          </div>
          <button class="dock-btn dock-menu" data-menu="history" title="面板菜单">
            <svg class="ic"><use href="#i-hamburger"/></svg>
          </button>
          <button class="dock-btn dock-toggle" title="折叠面板">
            <svg class="ic"><use href="#i-chevron-down"/></svg>
          </button>
        </div>
        <div class="dock-body">
          <section class="panel" data-panel="history" data-name="历史">
            <div class="hist-head">
              <button class="lb" id="btn-hist-undo" title="撤销 (⌘Z)">
                <svg class="ic"><use href="#i-undo"/></svg>
              </button>
              <button class="lb" id="btn-hist-redo" title="重做 (⇧⌘Z)">
                <svg class="ic"><use href="#i-redo"/></svg>
              </button>
              <span id="hist-memory" class="hist-mem"></span>
            </div>
            <div id="history-list"></div>
          </section>
          <section class="panel" data-panel="navigator" data-name="导航器">
            <div class="panel-body nav-body">
              <canvas id="navigator" width="260" height="140"></canvas>
              <div class="nav-hint">拖动红框平移视图</div>
            </div>
          </section>
        </div>
      </div>
    </aside>

    <!-- 浮动面板层 -->
    <div id="floating-layer">
      <section class="panel floating" data-panel="brushes" data-name="画笔" data-float="1" hidden>
        <div class="panel-title">
          <span class="panel-grip"></span>
          <span class="name">画笔</span>
          <span class="panel-sub">画笔预设</span>
          <button class="panel-close" title="关闭">×</button>
        </div>
        <div class="panel-body">
          <div class="brush-actions">
            <button class="wide-btn" id="btn-import-abr" title="导入 Photoshop 笔刷（.abr，也可拖入窗口）">导入 .abr 笔刷</button>
            <input type="file" id="file-abr" accept=".abr" style="display:none">
          </div>
          <div class="brush-grid" id="brush-presets"></div>
          <div class="panel-hint">单击切换画笔 · 右键打开画笔设置</div>
        </div>
      </section>

      <section class="panel floating" data-panel="dynamics" data-name="画笔设置" data-float="1" hidden>
        <div class="panel-title">
          <span class="panel-grip"></span>
          <span class="name">画笔设置</span>
          <span class="panel-sub">动态</span>
          <button class="panel-close" title="关闭">×</button>
        </div>
        <div class="panel-body dynamics-body">
          <div class="dyn-head">
            <span>压感曲线</span>
            <select id="dyn-curve-preset">
              <option value="linear">线性</option>
              <option value="soft">柔和</option>
              <option value="hard">硬朗</option>
              <option value="light">轻压</option>
            </select>
          </div>
          <canvas id="curve-editor" width="200" height="118" class="curve-editor" title="拖动控制点调整笔压响应曲线，点空白处可新增控制点"></canvas>
          <div class="dyn-row">
            <label class="opt-check"><input type="checkbox" id="dyn-tilt"> 倾斜控制大小</label>
          </div>
          <label class="dyn-slider">间距
            <input type="range" id="dyn-spacing" min="10" max="300" value="100">
            <span class="val" id="dyn-spacing-val">100%</span>
          </label>
          <label class="dyn-slider">散布
            <input type="range" id="dyn-scatter" min="0" max="100" value="0">
            <span class="val" id="dyn-scatter-val">0%</span>
          </label>
        </div>
      </section>
    </div>
  </main>

  <!-- ===== 状态栏 ===== -->
  <footer id="statusbar">
    <button class="zoom-mini" id="btn-zoom-out" title="缩小">−</button>
    <button class="zoom-field" id="zoom-label" title="双击适合屏幕">100%</button>
    <button class="zoom-mini" id="btn-zoom-in" title="放大">＋</button>
    <span class="sb-sep"></span>
    <span id="status-doc" title="文档尺寸">1600 × 1600 px</span>
    <span class="sb-sep"></span>
    <span id="status-memory" title="像素存储：瓦片数 · 占用内存"></span>
    <span class="sb-sep"></span>
    <span id="status-gpu" class="status-gpu" title="合成后端">CPU</span>
    <span class="sb-sep"></span>
    <span id="status-brush"></span>
    <span class="sb-fill"></span>
    <span id="status-pressure">压感 —</span>
    <span class="sb-sep"></span>
    <span id="status-color">前景 #222222</span>
    <span class="sb-sep"></span>
    <span id="status-autosave">未修改</span>
    <span class="sb-sep"></span>
    <span class="sb-version">beta25</span>
  </footer>
</div>

<!-- ===== 首页 / 欢迎页 ===== -->
<div id="home" class="hidden">
  <div class="home-top" data-tauri-drag-region="deep">
    <div class="home-logo">笔</div>
    <div class="home-brand">
      <h1>落笔生花</h1>
      <p>LUOBISHENGHUA · 专业绘画工作台</p>
    </div>
    <div class="home-spacer"></div>
    <button class="home-close" id="home-close">返回画布</button>
  </div>

  <div id="recovery-banner" class="recovery hidden">
    <span class="rec-ic">⟳</span>
    <span class="rec-text">发现上次未保存的工作：<b id="recovery-name">未命名.lbsh</b><span id="recovery-time" class="rec-time"></span></span>
    <button id="recovery-restore" class="primary">恢复</button>
    <button id="recovery-discard">丢弃</button>
  </div>

  <div class="home-grid">
    <div>
      <div class="home-section">
        <h2>开始</h2>
        <div class="home-actions">
          <button class="home-action primary" id="home-new">
            <span class="ic-wrap"><svg class="ic"><use href="#i-plus"/></svg></span>
            <span class="t">新建画布</span>
            <span class="d">自定义尺寸与预设</span>
          </button>
          <button class="home-action" id="home-open">
            <span class="ic-wrap"><svg class="ic"><use href="#i-open"/></svg></span>
            <span class="t">打开 PSD</span>
            <span class="d">继续编辑已有文档</span>
          </button>
          <button class="home-action" id="home-abr">
            <span class="ic-wrap"><svg class="ic"><use href="#i-brush"/></svg></span>
            <span class="t">导入 .abr 笔刷</span>
            <span class="d">接入 Photoshop 笔刷</span>
          </button>
        </div>
      </div>

      <div class="home-section">
        <h2>画布预设</h2>
        <div class="preset-grid" id="preset-grid"></div>
      </div>
    </div>

    <div class="home-section">
      <h2>最近文件</h2>
      <div class="recent-list" id="recent-list"></div>
    </div>
  </div>

  <div class="home-foot">
    <span>落笔生花 Luobishenghua · beta25</span>
    <span>WorkBuddy × likeweixue</span>
  </div>
</div>

<div id="toast"></div>
<div id="modal-overlay" class="hidden"><div id="modal"></div></div>
<div id="menu-layer"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
