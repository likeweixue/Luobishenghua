name: Build Desktop (macOS + Windows)

# 触发：推送到 main 自动构建并上传产物；推送 v* 标签自动发 Release 附带安装包
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: app
            out_dir: macos
            glob: '*.app'
            artifact: macos
          - platform: windows-latest
            bundle: nsis
            out_dir: nsis
            glob: '*.exe'
            artifact: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundle }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luobishenghua-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/${{ matrix.out_dir }}/${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/${{ matrix.out_dir }}/${{ matrix.glob }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
