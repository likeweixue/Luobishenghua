name: Build Desktop (macOS + Windows)

# 推送到 main：构建并上传 artifact；推送 v* 标签：构建并发布 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Browser tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck TypeScript modules
        run: npm run typecheck

      - name: Build TypeScript modules
        run: npm run build:ts

      - name: Verify generated app/js files are committed
        run: git diff --exit-code -- app/js/gpu.js app/js/tiles.js app/js/brush-worker.js app/js/engine.js app/js/layers.js app/js/history.js app/js/transform.js app/js/brushes.js app/js/main.js app/js/dock.js app/js/menu.js

      - name: Run browser tests
        run: npm test
        env:
          CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            bundle: app,dmg
            artifact: macOS
          - platform: windows-latest
            bundle: nsis
            artifact: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundle }}

      # Tauri 会用中文 productName 生成 `_0.1.0_...` 这类文件名；
      # 这里统一改成 luobishenghua-<ref>-<platform>.*，方便下载和分发。
      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          safe_ref="${GITHUB_REF_NAME//\//-}"
          name="luobishenghua-${safe_ref}-macos"
          mkdir -p dist
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$APP"
          test -n "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${name}.app.zip"
          cp "$DMG" "dist/${name}.dmg"
          ls -lh dist

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $safeRef = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "luobishenghua-$safeRef-windows"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No NSIS exe found" }
          Copy-Item $exe.FullName "dist/${name}.exe"
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luobishenghua-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 落笔生花 ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
