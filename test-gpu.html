<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>GPU TEST</title>
<style>
  body{background:#1b1b1d;color:#ddd;font:12px/1.6 -apple-system,monospace;padding:16px}
  pre{white-space:pre-wrap}
  canvas{position:absolute;left:-20000px;top:0}
  #gl{position:absolute;left:-20000px;top:0}
</style></head>
<body>
<canvas id="c2d" width="440" height="340"></canvas>
<canvas id="c2dx" width="440" height="340"></canvas>
<canvas id="gl" width="440" height="340"></canvas>
<pre id="out">running…</pre>
<script type="module">
import { Engine } from './app/js/engine.js';
import { LayerStack } from './app/js/layers.js';
import { maskFromCanvas } from './app/js/tiles.js';

const out = [];
let pass = 0, fail = 0;
const check = (ok, name, detail = '') => {
  if (ok) { pass++; out.push('  ✅ ' + name); }
  else { fail++; out.push('  ❌ ' + name + (detail ? ' — ' + detail : '')); }
};
const log = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };

const c2d = document.getElementById('c2d');
const c2dx = document.getElementById('c2dx');
const gl = document.getElementById('gl');
for (const c of [c2d, c2dx, gl]) { c.style.width = '440px'; c.style.height = '340px'; }

function block(surface, color, x, y, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cc = c.getContext('2d');
  cc.fillStyle = color;
  cc.fillRect(0, 0, w, h);
  surface.putCanvas(c, x, y);
}

function makeStack() {
  // LayerStack 构造时已自带「纸张 + 图层 1」，这里复用，避免多出一张纸
  const s = new LayerStack(400, 300);
  const l1 = s.layers[1];
  l1.name = '色块';
  block(l1.surface, '#e24b4a', 20, 20, 80, 60);    // 红
  block(l1.surface, '#2f6fa8', 200, 100, 120, 80); // 蓝
  const l2 = s._create('半透明');
  l2.opacity = 0.5;
  block(l2.surface, '#2f9e75', 120, 60, 120, 100); // 绿 50%
  s.layers.push(l2);
  s.activeId = l2.id;
  return s;
}

function maskedStack() {
  const s = makeStack();
  const l = s.layers[2];
  const mc = document.createElement('canvas');
  mc.width = 400; mc.height = 300;
  const mctx = mc.getContext('2d');
  mctx.fillStyle = '#ffffff';
  mctx.fillRect(0, 0, 400, 300);
  mctx.clearRect(150, 100, 120, 90);
  l.mask = { surface: maskFromCanvas(mc, 400, 300), enabled: true };
  return s;
}

function groupedStack() {
  const s = makeStack();
  const g = s.addGroup();
  s.moveIntoGroup(g.id, s.layers[1].id);
  s.moveIntoGroup(g.id, s.layers[1].id);
  g.opacity = 0.8;
  return s;
}

function groupMaskedStack() {
  const s = groupedStack();
  const g = s.layers[s.layers.length - 1];
  g.opacity = 1;
  const mc = document.createElement('canvas');
  mc.width = 400; mc.height = 300;
  const mctx = mc.getContext('2d');
  mctx.fillStyle = '#ffffff';
  mctx.fillRect(0, 0, 400, 300);
  mctx.clearRect(0, 0, 200, 300);
  g.mask = { surface: maskFromCanvas(mc, 400, 300), enabled: true };
  return s;
}

function groupBlendStack(mode) {
  const s = groupedStack();
  const g = s.layers[s.layers.length - 1];
  const bg = s._create('底色');
  block(bg.surface, '#e8c34a', 0, 0, 400, 300);
  s.layers.splice(1, 0, bg);
  g.opacity = 1;
  g.blend = mode;
  return s;
}

function blendWithTopStack(mode) {
  const s = makeStack();
  const l2 = s.layers[2];
  l2.opacity = 1;
  l2.blend = mode;
  const top = s._create('顶层');
  top.opacity = 0.5;
  block(top.surface, '#d24b8a', 180, 100, 120, 80);
  s.layers.push(top);
  s.activeId = top.id;
  return s;
}

function blendStack(mode) {
  const s = makeStack();
  const l = s.layers[2];
  l.opacity = 1;
  l.blend = mode;
  return s;
}

async function runPair(name, build, points, tol = 5) {
  const s2 = build();
  const s3 = build();
  const e2x = new Engine(c2d, 400, 300);
  e2x.layers = s2;
  e2x.resize();
  setView(e2x, 1, 20, 10);
  const e3x = new Engine(c2dx, 400, 300, gl);
  e3x.layers = s3;
  e3x.resize();
  setView(e3x, 1, 20, 10);
  e3x.scheduleDocSync = () => {};
  check(e3x.gpuActive(), name + ' 启用 GPU 路径', e3x.gpu && e3x.gpu.lastPlan && e3x.gpu.lastPlan.reason);
  if (!e3x.gpuActive()) return;
  e2x.render();
  e3x.render();
  await new Promise(r => requestAnimationFrame(r));
  for (const p of points) {
    await compareAt(e2x, e3x, name + ' · ' + p.label, { x: p.x, y: p.y }, tol);
  }
}

function setView(engine, scale, tx, ty, rot = 0) {
  engine.view.scale = scale;
  engine.view.rotation = rot;
  engine.view.tx = tx;
  engine.view.ty = ty;
  engine._paperDirty = true;
}

function screenOf(view, x, y) {
  const c = Math.cos(view.rotation), s = Math.sin(view.rotation);
  return [view.tx + (x * c - y * s) * view.scale, view.ty + (x * s + y * c) * view.scale];
}

function read2d(engine, x, y) {
  const dpr = engine.dpr;
  const d = engine.ctx.getImageData(Math.round(x * dpr), Math.round(y * dpr), 1, 1).data;
  return [d[0], d[1], d[2]];
}

function readGl(engine, x, y) {
  const dpr = engine.dpr;
  const g = engine.gpu.gl;
  const buf = new Uint8Array(4);
  g.readPixels(
    Math.round(x * dpr),
    Math.round((engine.canvas.clientHeight - 1 - y) * dpr),
    1, 1, g.RGBA, g.UNSIGNED_BYTE, buf,
  );
  return [buf[0], buf[1], buf[2]];
}

function near(a, b, tol = 3) {
  return Math.abs(a[0] - b[0]) <= tol && Math.abs(a[1] - b[1]) <= tol && Math.abs(a[2] - b[2]) <= tol;
}

async function compareAt(engine2, engine3, name, world, tol = 3) {
  const [sx, sy] = screenOf(engine2.view, world.x, world.y);
  const a = read2d(engine2, sx, sy);
  const b = readGl(engine3, sx, sy);
  check(near(a, b, tol), name, `2D=${a.join(',')} GPU=${b.join(',')} @${sx.toFixed(1)},${sy.toFixed(1)}`);
}

try {
  const s2 = makeStack();
  const s3 = makeStack();
  const e2 = new Engine(c2d, 400, 300);
  e2.layers = s2;
  e2.resize();
  setView(e2, 1, 20, 10);
  const e3 = new Engine(c2dx, 400, 300, gl);
  e3.layers = s3;
  e3.resize();
  setView(e3, 1, 20, 10);
  e3.scheduleDocSync = () => {};

  check(e3.gpuActive(), '简单图层栈启用 GPU 路径', e3.gpu && e3.gpu.error);
  e2.render();
  e3.render();
  await new Promise(r => requestAnimationFrame(r));

  log('GPU 合成测试：1:1 视图');
  await compareAt(e2, e3, '白纸像素一致', { x: 330, y: 30 });
  await compareAt(e2, e3, '红色块像素一致', { x: 40, y: 40 });
  await compareAt(e2, e3, '蓝色块像素一致', { x: 240, y: 120 });
  await compareAt(e2, e3, '50% 半透明图层合成一致', { x: 150, y: 100 });
  await compareAt(e2, e3, '文档外工作区一致', { x: -8, y: -4 }, 4);

  log('GPU 合成测试：1.5× 缩放 + 15° 旋转');
  for (const e of [e2, e3]) setView(e, 1.5, -40, -30, Math.PI / 12);
  e2.render();
  e3.render();
  await new Promise(r => requestAnimationFrame(r));
  await compareAt(e2, e3, '缩放/旋转后红块一致', { x: 40, y: 40 }, 4);
  await compareAt(e2, e3, '缩放/旋转后蓝块一致', { x: 240, y: 120 }, 4);
  await compareAt(e2, e3, '缩放/旋转后半透明合成一致', { x: 150, y: 100 }, 4);

  log('GPU 组 / 蒙版 / 混合模式');
  await runPair('图层蒙版', maskedStack, [
    { label: '绿色可见区', x: 130, y: 80 },
    { label: '蒙版挖空区', x: 180, y: 120 },
    { label: '未被蒙版的蓝块', x: 250, y: 120 },
  ], 5);
  await runPair('图层组 80%', groupedStack, [
    { label: '红色 80%', x: 40, y: 40 },
    { label: '绿色合成', x: 150, y: 100 },
    { label: '白纸', x: 330, y: 30 },
  ], 6);
  await runPair('组蒙版', groupMaskedStack, [
    { label: '组蒙版显示区', x: 250, y: 130 },
    { label: '组蒙版隐藏区', x: 100, y: 130 },
  ], 6);
  await runPair('混合后继续画普通层', () => blendWithTopStack('multiply'), [
    { label: '混合+顶层', x: 220, y: 120 },
    { label: '混合区外', x: 130, y: 80 },
  ], 7);
  await runPair('组混合 multiply', () => groupBlendStack('multiply'), [
    { label: '组内容·绿块', x: 150, y: 130 },
    { label: '组内容·蓝块', x: 250, y: 130 },
    { label: '组内容·红块', x: 40, y: 50 },
  ], 7);
  for (const mode of ['multiply', 'screen', 'overlay', 'soft-light', 'darken', 'lighten', 'color-dodge', 'lighter']) {
    await runPair('混合 ' + mode, () => blendStack(mode), [
      { label: '白底上', x: 130, y: 80 },
      { label: '蓝块上', x: 220, y: 120 },
      { label: '红块上', x: 150, y: 100 },
    ], 7);
  }

  log('回退条件');
  const sc = makeStack();
  sc.layers[2].clipping = true;
  const ec = new Engine(c2dx, 400, 300, gl);
  ec.layers = sc;
  ec.resize();
  check(!ec.gpuActive(), '剪贴蒙版回退 Canvas2D');
  ec.render();
  check(true, '回退渲染不抛异常');

  log('瓦片修订号');
  const before = e3.texRevProbe = [...s3.layers[1].surface.tiles.values()][0]?.rev || 0;
  block(s3.layers[1].surface, '#ffffff', 30, 30, 4, 4);
  const after = [...s3.layers[1].surface.tiles.values()][0]?.rev || 0;
  check(after > before, '绘制后瓦片 rev 递增');
} catch (err) {
  out.push('💥 异常：' + (err && err.stack ? err.stack : err));
  fail++;
}

document.title = fail === 0 ? 'PASS' : 'FAIL';
document.getElementById('out').textContent = `GPU 合成测试：${pass} 通过 / ${fail} 失败\n\n` + out.join('\n');
</script>
</body>
</html>
