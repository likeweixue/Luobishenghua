<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>N4 BENCH</title>
<style>body{background:#1b1b1d;color:#ddd;font:12px/1.6 -apple-system,monospace;padding:16px}
pre{white-space:pre-wrap}</style></head>
<body>
<canvas id="cv" width="1440" height="900" style="position:absolute;left:-20000px;top:0;width:1440px;height:900px"></canvas>
<pre id="out">running…</pre>
<script type="module">
import { Engine } from './app/js/engine.js';
import { LayerStack } from './app/js/layers.js';
import { History } from './app/js/history.js';
import { drawDab } from './app/js/brushes.js';

const out = [];
const log = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };
const fmt = (n) => n.toFixed(2);

const cv = document.getElementById('cv');
const engine = new Engine(cv, 1600, 1600);
engine.resize();

function makeStack(w, h, n) {
  const s = new LayerStack(w, h);
  // 已有纸张 + 图层1
  for (let i = 1; i < n; i++) s.addLayer();
  // 给每层一些内容，避免全空画布被浏览器优化
  let i = 0;
  const walk = (nodes) => nodes.forEach(nd => {
    if (nd.type === 'group') return walk(nd.children);
    i++;
    nd.ctx.fillStyle = `hsl(${(i * 37) % 360},60%,50%)`;
    nd.ctx.globalAlpha = 0.15;
    nd.ctx.fillRect(0, 0, w, h);
    nd.ctx.globalAlpha = 1;
    nd.ctx.fillStyle = '#222';
    nd.ctx.fillRect(20 + i * 5, 20 + i * 3, 300, 200);
  });
  walk(s.layers);
  return s;
}

function setView(w, h) {
  const s = Math.min(cv.width / w, cv.height / h) * 0.85;
  engine.view.scale = s;
  engine.view.rotation = 0;
  engine.view.tx = (cv.width - w * s) / 2;
  engine.view.ty = (cv.height - h * s) / 2;
}

function benchFullRender(times = 4) {
  engine.render(); // 预热
  const t = [];
  for (let i = 0; i < times; i++) {
    const t0 = performance.now();
    engine.render();
    t.push(performance.now() - t0);
  }
  t.sort((a, b) => a - b);
  return { avg: t.reduce((a, b) => a + b, 0) / t.length, p95: t[Math.floor(t.length * 0.95) - 1] ?? t[t.length - 1], max: t[t.length - 1] };
}

function benchView(times = 6) {
  const t = [];
  for (let i = 0; i < times; i++) {
    engine.view.tx += 3;
    engine._paperDirty = true;
    const t0 = performance.now();
    engine.renderViewOnly();
    t.push(performance.now() - t0);
  }
  t.sort((a, b) => a - b);
  return { avg: t.reduce((a, b) => a + b, 0) / t.length, p95: t[Math.floor(t.length * 0.95) - 1] ?? t[t.length - 1] };
}

function benchStroke(stack, frames = 12) {
  const hist = new History(engine, stack, 50);
  const layer = stack.active;
  const j = hist.beginStroke(layer.id);
  const t = [];
  for (let k = 0; k < frames; k++) {
    const x = 300 + k * 30;
    const y = 400 + Math.sin(k) * 120;
    const t0 = performance.now();
    j.captureBefore(x, y, 14);
    drawDab(layer.ctx, 'hard', '#222222', x, y, 26, 1, 0);
    // 走脏矩形渲染（与主程序笔画路径一致）
    engine.renderDirty({ x: x - 16, y: y - 16, w: 32, h: 32 });
    t.push(performance.now() - t0);
  }
  hist.commitStroke(j, 'bench');
  t.sort((a, b) => a - b);
  return {
    avg: t.reduce((a, b) => a + b, 0) / t.length,
    p95: t[Math.floor(t.length * 0.95) - 1] ?? t[t.length - 1],
    max: t[t.length - 1],
  };
}

async function run() {
  const cases = [
    { w: 1024, h: 1024, layers: 20 },
    { w: 1024, h: 1024, layers: 50 },
    { w: 1600, h: 1600, layers: 50 },
    { w: 2048, h: 2048, layers: 20 },
    { w: 2048, h: 2048, layers: 50 },
    { w: 4000, h: 4000, layers: 10 },
  ];

  log('尺寸        图层   内存估算   整屏合成(avg/p95)   视图重绘(avg/p95)   笔画帧(avg/p95)');
  log('─'.repeat(88));

  for (const c of cases) {
    const mem = (c.w * c.h * 4 * (c.layers + 1)) / 1024 / 1024;
    try {
      const stack = makeStack(c.w, c.h, c.layers);
      engine.layers = stack;
      engine.setDocSize(c.w, c.h);
      setView(c.w, c.h);
      const r = benchFullRender();
      const vw = benchView();
      const s = benchStroke(stack);
      log(
        `${c.w}×${c.h}`.padEnd(13) +
        String(c.layers).padEnd(7) +
        `${mem.toFixed(0)} MB`.padEnd(11) +
        `${fmt(r.avg)} / ${fmt(r.p95)}`.padEnd(21) +
        `${fmt(vw.avg)} / ${fmt(vw.p95)}`.padEnd(21) +
        `${fmt(s.avg)} / ${fmt(s.p95)}`
      );
      // 释放画布内存
      engine.layers = null;
      engine._caches = null;
      engine._paper = null;
      const free = (nodes) => nodes.forEach(nd => {
        if (nd.type === 'group') return free(nd.children);
        if (nd.canvas) { nd.canvas.width = 0; nd.canvas.height = 0; }
        if (nd.mask) { nd.mask.canvas.width = 0; nd.mask.canvas.height = 0; }
      });
      free(stack.layers);
      stack.layers.length = 0;
      await new Promise(r => setTimeout(r, 120));
    } catch (err) {
      log(`${c.w}×${c.h}  ${c.layers} 层  → 失败：${err.message}`);
    }
    await new Promise(r => setTimeout(r, 30));
  }

  log('');
  log('说明：整屏合成 = 图层变化后的全量合成；视图重绘 = 平移/缩放（不重新合成图层）；笔画帧 = 单个笔尖（历史瓦片快照 + 脏矩形渲染）。');
  document.title = 'BENCH DONE';
}

run().catch(e => {
  document.getElementById('out').textContent = '异常：' + (e.stack || e);
  document.title = 'ERROR';
});
</script>
</body>
</html>
