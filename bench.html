<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>N4 BENCH</title>
<style>body{background:#1b1b1d;color:#ddd;font:12px/1.6 -apple-system,monospace;padding:16px}
pre{white-space:pre-wrap}</style></head>
<body>
<canvas id="cv" width="1440" height="900" style="position:absolute;left:-20000px;top:0;width:1440px;height:900px"></canvas>
<pre id="out">running…</pre>
<script type="module">
import { Engine } from './app/js/engine.js';
import { LayerStack } from './app/js/layers.js';
import { History } from './app/js/history.js';
import { drawDab } from './app/js/brushes.js';

const out = [];
const log = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };
const fmt = (n) => n.toFixed(2);
const mb = (b) => (b / 1024 / 1024).toFixed(0) + ' MB';

const cv = document.getElementById('cv');
const engine = new Engine(cv, 1600, 1600);
engine.resize();

// 整层铺色（模拟“每层都有内容”的最坏情况）
function wash(nd, color, alpha) {
  const s = nd.surface;
  for (let ty = 0; ty < s.rows; ty++) {
    for (let tx = 0; tx < s.cols; tx++) {
      const t = s.getTile(tx, ty, true);
      t.ctx.globalAlpha = alpha;
      t.ctx.fillStyle = color;
      t.ctx.fillRect(0, 0, t.canvas.width, t.canvas.height);
    }
  }
}

// 局部画一块（模拟真实图层：只有画过的地方有像素）
function block(nd, color, x, y, w, h) {
  nd.surface.stamp(x + w / 2, y + h / 2, Math.max(w, h) / 2 + 2, (ctx) => {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  });
}

function makeStack(w, h, n, dense, withMask) {
  const s = new LayerStack(w, h);
  for (let i = 1; i < n; i++) s.addLayer();
  let i = 0;
  const walk = (nodes) => nodes.forEach(nd => {
    if (nd.type === 'group') return walk(nd.children);
    i++;
    const color = `hsl(${(i * 37) % 360},60%,50%)`;
    if (dense) wash(nd, color, 0.12);
    const bx = 20 + (i * 37) % (w - 320);
    const by = 20 + (i * 53) % (h - 220);
    block(nd, dense ? '#222' : color, bx, by, 300, 200);

    if (withMask) {
      // 每层一个蒙版，只在很小一块上擦除 → 只占 1 个瓦片
      s.addMask(nd.id);
      const c = document.createElement('canvas');
      c.width = c.height = 80;
      const cc = c.getContext('2d');
      cc.fillStyle = '#000';
      cc.beginPath();
      cc.arc(40, 40, 36, 0, Math.PI * 2);
      cc.fill();
      nd.mask.surface.drawCanvas(c, bx + 60, by + 40, { composite: 'destination-out' });
    }
  });
  walk(s.layers);
  return s;
}

function setView(w, h) {
  const s = Math.min(cv.width / w, cv.height / h) * 0.85;
  engine.view.scale = s;
  engine.view.rotation = 0;
  engine.view.tx = (cv.width - w * s) / 2;
  engine.view.ty = (cv.height - h * s) / 2;
  engine._paperDirty = true;
}

function benchFullRender(times = 4) {
  engine.render();
  const t = [];
  for (let i = 0; i < times; i++) {
    const t0 = performance.now();
    engine.render();
    t.push(performance.now() - t0);
  }
  t.sort((a, b) => a - b);
  return { avg: t.reduce((a, b) => a + b, 0) / t.length, p95: t[Math.floor(t.length * 0.95) - 1] ?? t[t.length - 1] };
}

function benchView(times = 6) {
  const t = [];
  for (let i = 0; i < times; i++) {
    engine.view.tx += 3;
    engine._paperDirty = true;
    const t0 = performance.now();
    engine.renderViewOnly();
    t.push(performance.now() - t0);
  }
  t.sort((a, b) => a - b);
  return { avg: t.reduce((a, b) => a + b, 0) / t.length, p95: t[Math.floor(t.length * 0.95) - 1] ?? t[t.length - 1] };
}

function benchStroke(stack, frames = 12) {
  const hist = new History(engine, stack, 50);
  const layer = stack.active;
  const j = hist.beginStroke(layer.id);
  const t = [];
  for (let k = 0; k < frames; k++) {
    const x = 300 + k * 30;
    const y = 400 + Math.sin(k) * 120;
    const t0 = performance.now();
    j.captureBefore(x, y, 14);
    layer.surface.stamp(x, y, 14, (ctx) => drawDab(ctx, 'hard', '#222222', x, y, 26, 1, 0));
    engine.renderDirty({ x: x - 16, y: y - 16, w: 32, h: 32 });
    t.push(performance.now() - t0);
  }
  hist.commitStroke(j, 'bench');
  t.sort((a, b) => a - b);
  return {
    avg: t.reduce((a, b) => a + b, 0) / t.length,
    p95: t[Math.floor(t.length * 0.95) - 1] ?? t[t.length - 1],
    histKB: Math.round(hist.memoryBytes() / 1024),
  };
}

async function run() {
  // dense = 每层整层铺色（最坏情况）；否则只在局部画一块（接近真实图层）
  const cases = [
    { w: 1024, h: 1024, layers: 50, dense: true },
    { w: 1600, h: 1600, layers: 50, dense: true },
    { w: 2048, h: 2048, layers: 50, dense: true },
    { w: 4000, h: 4000, layers: 20, dense: false },
    { w: 4000, h: 4000, layers: 50, dense: false },
    { w: 4000, h: 4000, layers: 20, dense: false, masks: true },
  ];

  log('尺寸         图层  蒙版  像素内存(实测)  瓦片数  整屏合成(avg/p95)  视图重绘(avg/p95)  笔画帧(avg/p95)  撤销KB');
  log('─'.repeat(120));

  for (const c of cases) {
    const theoretical = (c.w * c.h * 4 * (c.layers + 1)) / 1024 / 1024;
    try {
      const stack = makeStack(c.w, c.h, c.layers, c.dense, c.masks);
      engine.layers = stack;
      engine.setDocSize(c.w, c.h);
      setView(c.w, c.h);
      const r = benchFullRender();
      const vw = benchView();
      const s = benchStroke(stack);
      const realBytes = stack.pixelBytes();
      log(
        `${c.w}×${c.h}`.padEnd(13) +
        String(c.layers).padEnd(6) +
        (c.masks ? `${(stack.maskBytes() / 1024 / 1024).toFixed(0)}MB` : '—').padEnd(6) +
        `${mb(realBytes)}`.padEnd(16) +
        String(stack.tileCount()).padEnd(8) +
        `${fmt(r.avg)} / ${fmt(r.p95)}`.padEnd(20) +
        `${fmt(vw.avg)} / ${fmt(vw.p95)}`.padEnd(20) +
        `${fmt(s.avg)} / ${fmt(s.p95)}`.padEnd(18) +
        String(s.histKB)
      );
      log(`               └ 整层画布方案需要 ${theoretical.toFixed(0)} MB（不含蒙版），瓦片实际 ${mb(realBytes)}` +
        (c.masks ? `；蒙版 ${mb(stack.maskBytes())}，若用整层蒙版再加 ${(c.layers * c.w * c.h * 4 / 1024 / 1024).toFixed(0)} MB` : ''));

      // 释放
      engine.layers = null;
      engine._caches = null;
      engine._paper = null;
      engine._docValid = false;
      for (const nd of stack.leaves()) nd.surface.clearAll();
      stack.layers.length = 0;
      await new Promise(r => setTimeout(r, 120));
    } catch (err) {
      log(`${c.w}×${c.h}  ${c.layers} 层  → 失败：${err.message}`);
    }
    await new Promise(r => setTimeout(r, 30));
  }

  log('');
  log('说明：dense 组每层整层铺色（最坏情况）；4000² 组只在局部画一块（真实图层常见形态）；最后一行每层带一个只擦了一小块的蒙版。');
  log('整屏合成 = 图层变化后的全量合成；视图重绘 = 平移/缩放（不重新合成）；笔画帧 = 单笔尖（瓦片快照 + 脏矩形渲染）。');
  document.title = 'BENCH DONE';
}

run().catch(e => {
  document.getElementById('out').textContent = '异常：' + (e.stack || e);
  document.title = 'ERROR';
});
</script>
</body>
</html>
