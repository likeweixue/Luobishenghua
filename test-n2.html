<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>N2 TEST</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { LayerStack } from './app/js/layers.js';
import { History } from './app/js/history.js';
import { serializeProject, deserializeProject } from './app/js/project.js';
import { writePSD, readPSD } from './app/js/psd.js';

const out = [];
let pass = 0, fail = 0;
const check = (cond, label, extra = '') => {
  if (cond) { pass++; out.push('✅ ' + label); }
  else { fail++; out.push('❌ ' + label + (extra ? ' — ' + extra : '')); }
};

function px(target, x, y) {
  if (target && target.surface) return target.surface.pixelAt(x, y);
  const ctx = (target && target.ctx)
    || (typeof target.getImageData === 'function' ? target : target.getContext('2d'));
  const d = ctx.getImageData(x, y, 1, 1).data;
  return [d[0], d[1], d[2], d[3]];
}

// 往瓦片图层上画一块纯色
function paintLayer(layer, color, x, y, w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const cc = c.getContext('2d');
  cc.fillStyle = color;
  cc.fillRect(0, 0, w, h);
  layer.surface.putCanvas(c, x, y);
}

function compPx(stack, x, y) {
  const c = document.createElement('canvas');
  c.width = stack.w; c.height = stack.h;
  const ctx = c.getContext('2d');
  stack.composite(ctx, { checkerboard: false });
  return px(ctx, x, y);
}

// 在蒙版上擦一块（destination-out = 隐藏）
function maskErase(mask, x, y, w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w);
  c.height = Math.max(1, h);
  const cc = c.getContext('2d');
  cc.fillStyle = '#000000';
  cc.fillRect(0, 0, c.width, c.height);
  mask.surface.drawCanvas(c, x, y, { composite: 'destination-out' });
}

function maskEraseCircle(mask, cx, cy, r) {
  const c = document.createElement('canvas');
  c.width = c.height = r * 2;
  const cc = c.getContext('2d');
  cc.fillStyle = '#000000';
  cc.beginPath();
  cc.arc(r, r, r, 0, Math.PI * 2);
  cc.fill();
  mask.surface.drawCanvas(c, cx - r, cy - r, { composite: 'destination-out' });
}

// PSD 节点现在是通道平面，直接从平面读像素
function planePx(node, x, y) {
  const p = node.planes || {};
  const lx = x - (node.left || 0);
  const ly = y - (node.top || 0);
  if (lx < 0 || ly < 0 || lx >= (node.width || 0) || ly >= (node.height || 0)) return [0, 0, 0, 0];
  const i = ly * node.width + lx;
  return [p[0] ? p[0][i] : 0, p[1] ? p[1][i] : 0, p[2] ? p[2][i] : 0, p[-1] ? p[-1][i] : 255];
}

const isRed = p => p[0] > 180 && p[1] < 110 && p[2] < 110;
const isGreen = p => p[1] > 120 && p[0] < 110 && p[2] < 130;
const isBlue = p => p[2] > 150 && p[0] < 110;
const isWhite = p => p[0] > 240 && p[1] > 240 && p[2] > 240;

async function run() {
  /* ================= 1. 剪贴蒙版 ================= */
  const s = new LayerStack(200, 150);
  const base = s.active;
  base.name = '底色';
  paintLayer(base, '#e24b4a', 10, 10, 40, 40);

  const clip = s.addLayer();
  clip.name = '剪贴层';
  paintLayer(clip, '#1d9e75', 0, 0, 200, 150);
  s.toggleClipping(clip.id);

  let p = compPx(s, 25, 25);
  check(isGreen(p), '剪贴层只在基底范围内显示', p + '');
  p = compPx(s, 100, 100);
  check(isWhite(p), '基底之外不显示剪贴层', p + '');

  /* ================= 2. 图层蒙版 ================= */
  s.setActive(base.id);
  s.addMask(base.id);
  maskEraseCircle(base.mask, 25, 25, 8);

  p = compPx(s, 25, 25);
  check(isWhite(p) || p[3] === 0, '蒙版挖洞处被隐藏（剪贴层也随之隐藏）', p + '');
  p = compPx(s, 15, 15);
  check(isGreen(p), '蒙版未遮挡处：剪贴层覆盖基底（符合 PS 行为）', p + '');
  check(isRed(px(base, 15, 15)), '基底图层自身像素仍是红色', px(base, 15, 15) + '');

  // 停用蒙版 → 挖洞处恢复
  s.toggleMaskEnabled(base.id);
  p = compPx(s, 25, 25);
  check(!isWhite(p), '停用蒙版后挖洞处恢复显示', p + '');
  s.toggleMaskEnabled(base.id);

  /* ================= 3. 图层组 ================= */
  // 组的插入位置跟随激活层：先选中剪贴层，保证组落在最上层，
  // 否则剪贴层会压到组上、变成「剪贴到组」
  s.setActive(clip.id);
  const g = s.addGroup();
  g.name = '组 A';
  const inner = s.addLayer();
  inner.name = '组内层';
  paintLayer(inner, '#378add', 120, 20, 30, 30);

  check(s.flatTopFirst().some(it => it.node === g && it.depth === 0), '组在根层（depth 0）');
  check(s.flatTopFirst().some(it => it.node === inner && it.depth === 1), '组内图层缩进 depth 1');
  p = compPx(s, 130, 30);
  check(isBlue(p), '组内图层正常合成', p + '');

  s.setVisible(g.id, false);
  p = compPx(s, 130, 30);
  check(isWhite(p), '隐藏组 → 组内内容一起隐藏', p + '');
  s.setVisible(g.id, true);

  /* ================= 4. 工程 v2 往返 ================= */
  const flatBefore = compPx(s, 25, 25);
  const { bytes, manifest } = await serializeProject(s, { doc: null });
  check(manifest.version === 2, '工程版本 2');
  check(manifest.nodes.length === 4, '工程记录根节点 4 个（纸张/底色/剪贴/组）', manifest.nodes.length + '');
  const groupDef = manifest.nodes.find(n => n.type === 'group');
  check(!!groupDef && groupDef.children.length === 1, '工程里组含 1 个子层');
  const maskDef = manifest.nodes.find(n => n.mask);
  check(!!maskDef, '工程里记录了蒙版');
  check(manifest.nodes.some(n => n.clipping), '工程里记录了剪贴标记');

  const proj = await deserializeProject(bytes);
  check(proj.nodes.length === 4, '反序列化根节点 4 个');
  const backGroup = proj.nodes.find(n => n.type === 'group');
  check(!!backGroup && backGroup.children.length === 1, '反序列化组结构正确');
  const backMask = proj.nodes.find(n => n.maskCanvas);
  check(!!backMask, '反序列化蒙版画布存在');

  // 导入新栈，比对像素
  const s2 = new LayerStack(200, 150);
  s2.reset(200, 150);
  s2.layers = s2.importNodes(proj.nodes);
  s2.activeId = s2.leaves().slice(-1)[0].id;
  const flatAfter = compPx(s2, 25, 25);
  check(flatBefore.join(',') === flatAfter.join(','), '工程往返后合成像素一致', flatBefore + ' vs ' + flatAfter);
  check(isGreen(compPx(s2, 15, 15)), '往返后剪贴效果仍在');

  /* ================= 5. 向下合并 ================= */
  const ms = new LayerStack(50, 50);
  const mPaper = ms.layers[0];
  const bottom = ms.active;
  bottom.name = '底';
  paintLayer(bottom, '#e24b4a', 0, 0, 50, 50);
  const top = ms.addLayer();
  top.name = '上';
  paintLayer(top, '#378add', 0, 0, 25, 50);
  const okMerge = ms.mergeDown(top.id);
  check(okMerge === true, '向下合并成功');
  check(ms.layers.length === 2, '合并后只剩纸张 + 1 层', ms.layers.length + '');
  const mp = px(ms.layers[1], 10, 10), mp2 = px(ms.layers[1], 40, 10);
  check(isBlue(mp), '合并后上层颜色保留（左半）', mp + '');
  check(isRed(mp2), '合并后下层颜色保留（右半）', mp2 + '');

  /* ================= 6. PSD 往返（组/蒙版/剪贴） ================= */
  const ps = new LayerStack(64, 64);
  ps.layers[0].name = '纸张';
  const a = ps.active;
  a.name = '底色';
  paintLayer(a, '#e24b4a', 5, 5, 30, 30);
  ps.addMask(a.id);
  maskErase(a.mask, 20, 0, 44, 64);

  const b = ps.addLayer();
  b.name = '剪贴层';
  paintLayer(b, '#378add', 0, 0, 64, 64);
  ps.toggleClipping(b.id);

  const pg = ps.addGroup();
  pg.name = '组 A';
  const pc = ps.addLayer();
  pc.name = '组内层';
  paintLayer(pc, '#1d9e75', 40, 40, 20, 20);

  const flat = document.createElement('canvas');
  flat.width = 64; flat.height = 64;
  ps.composite(flat.getContext('2d'), { checkerboard: false });

  const psdBytes = writePSD({
    width: 64, height: 64,
    nodes: ps.layers,
    compositeImage: flat.getContext('2d').getImageData(0, 0, 64, 64),
  });
  check(psdBytes.length > 100, 'PSD 写出字节数 ' + psdBytes.length);

  const buf = psdBytes.buffer.slice(psdBytes.byteOffset, psdBytes.byteOffset + psdBytes.byteLength);
  const parsed = readPSD(buf);
  check(parsed.width === 64 && parsed.height === 64, 'PSD 尺寸正确');
  check(parsed.nodes.length === 4, 'PSD 根节点 4 个（纸张/底色/剪贴/组）', parsed.nodes.length + '');

  const pGroup = parsed.nodes.find(n => n.type === 'group');
  check(!!pGroup, 'PSD 读到组');
  check(pGroup && pGroup.children.length === 1, 'PSD 组内 1 个子层', pGroup ? pGroup.children.length + '' : '');
  check(pGroup && pGroup.children[0].name === '组内层', 'PSD 组内层名称正确');

  const pMasked = parsed.nodes.find(n => n.maskPlane);
  check(!!pMasked, 'PSD 读到蒙版（通道平面）');
  const mo = pMasked && pMasked.maskRect;
  const mIdx = mo ? (10 - mo.y) * mo.w + (30 - mo.x) : -1;
  check(!!pMasked && mIdx >= 0 && pMasked.maskPlane[mIdx] === 0,
        'PSD 蒙版像素正确（右侧被遮）', pMasked && pMasked.maskPlane[mIdx]);

  const pClipped = parsed.nodes.find(n => n.clipping);
  check(!!pClipped, 'PSD 读到剪贴标记');

  const aBack = parsed.nodes.find(n => n.name === '底色');
  check(!!aBack && isRed(planePx(aBack, 10, 10)), 'PSD 图层像素正确（通道平面）');

  /* ================= 7. 蒙版稀疏化（瓦片） ================= */
  const ms2 = new LayerStack(1024, 768);
  const ml = ms2.active;
  paintLayer(ml, '#e24b4a', 0, 0, 1024, 768);
  ms2.addMask(ml.id);
  check(ml.mask.surface.tileCount === 0, '新建蒙版不分配瓦片（默认全显示）');
  check(ms2.maskBytes() === 0, '全显示蒙版内存为 0', ms2.maskBytes() + '');
  check(isRed(compPx(ms2, 500, 400)), '全显示蒙版不遮挡内容');

  // 只在 100,100 附近擦一块 → 只分配 1 个瓦片
  maskEraseCircle(ml.mask, 100, 100, 30);
  check(ml.mask.surface.tileCount === 1, '画一笔蒙版只分配 1 个瓦片', ml.mask.surface.tileCount);
  check(ms2.maskBytes() < 1024 * 768 * 4 * 0.2, '蒙版内存远小于整层', ms2.maskBytes() + '');
  check(compPx(ms2, 100, 100)[3] === 0 || isWhite(compPx(ms2, 100, 100)), '擦掉的区域被隐藏',
    compPx(ms2, 100, 100) + '');
  check(isRed(compPx(ms2, 500, 400)), '没碰过的区域仍然显示');

  // 停用/启用
  ms2.toggleMaskEnabled(ml.id);
  check(isRed(compPx(ms2, 100, 100)), '停用蒙版后恢复显示');
  ms2.toggleMaskEnabled(ml.id);

  // 清空蒙版 → 回到全显示且零瓦片
  ms2.clearMask(ml.id);
  check(ml.mask.surface.tileCount === 0, '清空蒙版后瓦片归零');
  check(isRed(compPx(ms2, 100, 100)), '清空蒙版后内容恢复');

  // 反相：全显示 → 全隐藏
  ms2.invertMask(ml.id);
  check(ml.mask.surface.tileCount > 0, '反相后蒙版被物化（全隐藏）', ml.mask.surface.tileCount);
  const invComp = compPx(ms2, 500, 400);
  check(invComp[3] === 0 || isWhite(invComp), '反相后整层被隐藏', invComp + '');

  // 蒙版上的笔画可撤销
  const mh = new History({ render() {} }, ms2, 50);
  ms2.clearMask(ml.id);
  const mj = mh.beginStroke(ml.id, 'mask');
  mj.captureBefore(300, 300, 20);
  maskEraseCircle(ml.mask, 300, 300, 15);
  mh.commitStroke(mj, '擦蒙版');
  const afterErase = compPx(ms2, 300, 300);
  mh.undo();
  check(isRed(compPx(ms2, 300, 300)), '撤销蒙版笔画后恢复显示', compPx(ms2, 300, 300) + '');
  check(afterErase[3] === 0 || isWhite(afterErase), '（对照）擦除后确实不可见', afterErase + '');

  /* ================= 8. PSD 导入的蒙版也是稀疏的 ================= */
  const s3 = new LayerStack(64, 64);
  s3.layers = [];
  s3.layers = s3.importNodes(parsed.nodes);
  const importedMask = s3.leaves().find(l => l.mask);
  check(!!importedMask, 'PSD 蒙版导入成功');
  check(importedMask && importedMask.mask.surface.tileCount <= 1,
    'PSD 蒙版只占少量瓦片（64×64 → ≤1）', importedMask && importedMask.mask.surface.tileCount);
  const impLayer = s3.leaves().find(l => l.name === '底色');
  check(!!impLayer && isRed(px(impLayer, 10, 10)), 'PSD 图层像素进了瓦片', impLayer && px(impLayer, 10, 10) + '');

  const text = out.join('\n');
  document.getElementById('out').textContent = text + `\n\n结果：${pass} 通过 / ${fail} 失败`;
  document.title = fail ? 'FAIL ' + fail : 'PASS ' + pass;
}

run().catch(err => {
  document.getElementById('out').textContent = '异常：' + (err.stack || err);
  document.title = 'ERROR';
});
</script>
</body>
</html>
